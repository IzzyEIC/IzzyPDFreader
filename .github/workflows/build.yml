name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # potrzebne do tworzenia Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Przygotuj klucz podpisu
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu SIGNING_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Zbuduj APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk IzzyPDFreader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-apk
          path: IzzyPDFreader.apk

      - name: Opublikuj w Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Wersja 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: IzzyPDFreader.apk
